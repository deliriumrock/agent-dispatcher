[package]
name = "disp"
version.workspace = true
edition = "2024"
description = "Диспетчер сессий AI-агентов: Claude Code, Codex CLI, Gemini CLI"
license-file.workspace = true
publish = false

# Графическая оболочка — отдельный пакет: её тяжёлые зависимости не должны попадать
# в `disp`, который хуки агентов запускают на каждое событие. `cargo build` в корне
# собирает только `disp`; оболочка собирается как `cargo build -p disp-gui`.
[workspace]
members = [".", "gui", "tray"]
default-members = ["."]

# Версия общая для `disp` и `disp-gui`.
[workspace.package]
# Третья цифра — номер сборки, показывается тремя знаками: 0.8.1 — это «0.8.001».
# Повышается командой `make bump` перед каждой сборкой, которая уходит в работу.
version = "0.8.31"
# Apache 2.0 с условием Commons Clause: у такого сочетания нет обозначения SPDX,
# поэтому указан файл, а не поле `license`.
license-file = "LICENSE"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = { version = "3", features = ["termination"] }
indexmap = { version = "2", features = ["serde"] }
miniz_oxide = "0.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["event", "param"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
terminal_size = "0.4"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
